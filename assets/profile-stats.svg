<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title desc">
  <title id="title">GitHub account statistics</title>
  <desc id="desc">Public repositories, stars, followers, and forks. Values are updated daily by GitHub Actions.</desc>
  <rect x="1" y="1" width="998" height="208" rx="20" fill="#0F172A" stroke="#334155" />
  <text x="34" y="42" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">GITHUB SNAPSHOT</text>
  <text x="966" y="42" text-anchor="end" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" id="updated">Updated 19 Nov 2026</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(28 65)"><rect width="224" height="112" rx="14" fill="#17263A" /><text x="18" y="31" fill="#7DD3FC" font-size="12" font-weight="700" letter-spacing="1">PUBLIC REPOSITORIES</text><text id="repos" x="18" y="82" fill="#F8FAFC" font-size="38" font-weight="750">21</text></g>
    <g transform="translate(264 65)"><rect width="224" height="112" rx="14" fill="#17263A" /><text x="18" y="31" fill="#7DD3FC" font-size="12" font-weight="700" letter-spacing="1">TOTAL STARS</text><text id="stars" x="18" y="82" fill="#F8FAFC" font-size="38" font-weight="750">0</text></g>
    <g transform="translate(500 65)"><rect width="224" height="112" rx="14" fill="#17263A" /><text x="18" y="31" fill="#7DD3FC" font-size="12" font-weight="700" letter-spacing="1">FOLLOWERS</text><text id="followers" x="18" y="82" fill="#F8FAFC" font-size="38" font-weight="750">7</text></g>
    <g transform="translate(736 65)"><rect width="236" height="112" rx="14" fill="#17263A" /><text x="18" y="31" fill="#7DD3FC" font-size="12" font-weight="700" letter-spacing="1">REPO FORKS</text><text id="forks" x="18" y="82" fill="#F8FAFC" font-size="38" font-weight="750">0</text></g>
  </g>
  <text x="34" y="196" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Based on public repositories and public profile data.</text>
