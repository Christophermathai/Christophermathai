name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  push:
    branches: [main]
    paths:
      - "scripts/update_profile.py"
      - "assets/profile-stats.svg"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh public GitHub statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Christophermathai
        run: python scripts/update_profile.py

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg
          if git diff --cached --quiet; then
            echo "No statistics changes to commit."
          else
            git commit -m "chore: refresh GitHub profile statistics"
            git push
          fi
